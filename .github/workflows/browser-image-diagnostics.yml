name: Diagnose live calendar images in browser
on:
  push:
    paths:
      - ".github/workflows/browser-image-diagnostics.yml"
      - "index.html"
      - "tests/browser_diagnostics.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install chromium webkit --with-deps
      - name: Test deployed mobile and desktop page
        run: python tests/browser_diagnostics.py
      - name: Commit diagnostic results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if test -f test-results/browser-image-diagnostic.json; then
            git add test-results/browser-image-diagnostic.json
            if ! git diff --cached --quiet; then
              git commit -m "Record live mobile image rendering results"
              git push
            fi
          fi
