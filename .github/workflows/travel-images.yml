name: Download and validate travel photographs
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_images.py'
      - '.github/workflows/travel-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Download, decode, validate all images
        run: python scripts/fetch_images.py
      - name: Commit valid site-owned images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/
          if ! git diff --cached --quiet; then
            git commit -m "Add validated self-hosted travel images"
            git push
          fi
